<div class="details">
    <div class="image">
        @if (item()?.imageUrl) {
            <img [src]="item()!.imageUrl" alt="" />
        }
    </div>

    <div class="info">
        <div class="info-top">
            <div class="name">{{ item() | i18nField: 'productName' }}</div>
            <div class="desc">{{ item()?.descriptionCn }}</div>
        </div>

        <!-- 单品 -->
        @if (item()?.productType === ProductType.PRODUCT) {
            <app-single-item
                #singleItemRef
                [data]="item()"
                (selectedChange)="selectedChange($event)"
            ></app-single-item>
        }
        <!-- 套餐 -->
        @if (item()?.productType === ProductType.COMBO) {
            <app-combo-item
                #comboItemRef
                [data]="item()"
                (selectedChange)="selectedChange($event)"
            ></app-combo-item>
        }

        <!-- 价格 步进器-->
        <div class="add_price">
            <span class="price">{{ totalPrice() | priceI18n }}</span>

            <div>
                <span class="add" (click)="decreaseQuantity()">
                    <img ngSrc="/assets/image/minus.png" alt="" height="30" width="30"/>
                </span>
                <span>{{ addQuantity() }}</span>

                <span class="add" (click)="increaseQuantity()">
                    <img ngSrc="/assets/image/add.png" alt="" height="30" width="30"/>
                </span>
            </div>
        </div>
    </div>

    <div class="add_button" (click)="addToCart()">
        <img ngSrc="/assets/image/cart.png" alt="" height="56" width="61"/>
        <span>{{ 'menu.detail.addCart' | translate }}</span>
    </div>
</div>
