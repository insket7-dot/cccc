<div class="home-container">
    <div class="language-selector">
        <app-language-selector></app-language-selector>
    </div>

    <div class="logo" (click)="onLogoClick()">
        <img
            class="logo-img"
            ngSrc="/assets/image/Layer_1.png"
            alt="Yaki Logo"
            width="386"
            height="128"
        />
    </div>

    <div class="tip">
        {{ 'page.tip' | translate }}
    </div>

    <div class="take-list">
        @for (item of wayList(); track item.type) {
            <div class="take-item" (click)="toggleWay(item)">
                @if (item.icon) {
                    <img class="take-icon" [ngSrc]="item.icon" alt="" width="100" height="100" />
                }
                <span class="take_type">{{ item.name | translate }}</span>

                @if (curWay() === item.type) {
                    <img
                        class="active"
                        ngSrc="/assets/image/select.png"
                        alt=""
                        width="86"
                        height="86"
                    />
                }
            </div>
        }
    </div>

    <div class="start-btn" (click)="startOrder()">
        {{ 'page.startBtn' | translate }}
    </div>

    <div class="model-list">
        @for (item of modelList(); track item.type) {
            <div
                class="model-item"
                [class.selected]="curModel() === item.type"
                (click)="toggleModel(item)"
            >
                @if (item.icon) {
                    <img
                        class="model-item-icon"
                        [ngSrc]="item.icon"
                        alt=""
                        width="70"
                        height="70"
                    />
                }
                <div class="model-name">{{ item.name | translate }}</div>
            </div>
        }
    </div>
</div>
