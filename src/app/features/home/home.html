<div class="home-container">
     <div class="language-selector">
                    <app-language-selector></app-language-selector>

  </div>


    <div class="logo">
        <img src="https://img2.baidu.com/it/u=793173674,3413416703&fm=253&fmt=auto&app=120&f=JPEG?w=500&h=500" alt="Yaki Logo" />
    </div>

    <div class="tip">
        {{ 'page.tip' | translate }}
    </div>

    <div class="take-list">
        @for (item of wayList(); track item.type) {
        <div class="take-item">
            {{ item.name | translate }}
        </div>
        }
    </div>

    <div class="start-btn" (click)="startOrder()" >
        {{ 'page.startBtn' | translate }}
    </div>

    <div class="model-list">

        @for (item of modelList(); track item.type) {
        <div class="model-item" [class.selected]="curModel === item.type" (click)="toggleModel(item)" >
            <img [src]="item.icon" alt="" />
            <div class="model-name">{{ item.name | translate }}</div>
        </div>
        }
    </div>
</div>
