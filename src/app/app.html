<main class="main" [@routeAnimations]="getRouteAnimationData()">
    <router-outlet #outlet="outlet" />
</main>

<!-- 全局加载遮罩 -->
@if (loading()) {
    <div class="global-overlay">
        <div class="overlay-card">
            <mat-progress-spinner
                mode="indeterminate"
                diameter="36"
                color="primary"
            ></mat-progress-spinner>
            <span>{{ 'app.common.request.waiting' | translate }}</span>
        </div>
    </div>
}
